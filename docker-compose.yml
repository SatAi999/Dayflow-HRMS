version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: dayflow_mongodb
    ports:
      - "27017:27017"
    volumes:
      - dayflow_db_data:/data/db
    networks:
      - dayflow_network

# Named volumes for data persistence
volumes:
  dayflow_db_data:

# Networks for internal container communication
networks:
  dayflow_network:
    driver: bridge
